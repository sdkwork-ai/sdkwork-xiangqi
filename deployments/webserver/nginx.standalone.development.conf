# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/xiangqi/webserver.pid;
error_log /var/log/sdkwork/xiangqi/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name xiangqi-dev.sdkwork.com xiangqi-dev.birdcoder.com xiangqi-dev.dtupay.com xiangqi-dev.sdkwork.cn xiangqi-dev.birdcoder.cn xiangqi-dev.dtupay.cn xiangqi-dev.skubc.com xiangqi-dev.skubc.cn xiangqi-dev.zowalk.com xiangqi-dev.zowalk.cn xiangqi-dev.offer86.com xiangqi-dev.offer86.cn xiangqi-dev.86offer.com xiangqi-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
