# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/xiangqi/webserver.pid;
error_log /var/log/sdkwork/xiangqi/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name xiangqi-staging.sdkwork.com xiangqi-staging.birdcoder.com xiangqi-staging.dtupay.com xiangqi-staging.sdkwork.cn xiangqi-staging.birdcoder.cn xiangqi-staging.dtupay.cn xiangqi-staging.skubc.com xiangqi-staging.skubc.cn xiangqi-staging.zowalk.com xiangqi-staging.zowalk.cn xiangqi-staging.offer86.com xiangqi-staging.offer86.cn xiangqi-staging.86offer.com xiangqi-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
